---
# Source: devpod/templates/agent-rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devpod-agent
  namespace: devpod-system
  labels: 
    app.kubernetes.io/name: devpod
    app.kubernetes.io/instance: devpod
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: devpod-0.1.0
---
# Source: devpod/templates/agent-rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devpod-agent
  labels: 
    app.kubernetes.io/name: devpod
    app.kubernetes.io/instance: devpod
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: devpod-0.1.0
rules:
# Users here hold only what the console writes of them: the registries
# they saved credentials for, for this cluster's controller.
- apiGroups: ["devpod.io"]
  resources: ["users"]
  verbs: ["get", "list", "watch", "create", "update"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
# the volume a DevPod's home is bound to, read only (its machine, when on
# a machine's own disk)
- apiGroups: [""]
  resources: ["persistentvolumes"]
  verbs: ["get"]
# every pod, to read only: what workloads other than DevPods hold on each
# node, which the agent tells the console (the console counts it as taken)
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
# Read always (consoles before v0.9.25 kept them in their cache of this
# cluster; reservations are the console's own now); changed only where
# reservations are on.
- apiGroups: ["devpod.io"]
  resources: ["reservations"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["kore.zjusct.io"]
  resources: ["korenodetopologies"]
  verbs: ["get", "list", "watch"]
---
# Source: devpod/templates/agent-rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devpod-agent
  labels: 
    app.kubernetes.io/name: devpod
    app.kubernetes.io/instance: devpod
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: devpod-0.1.0
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: devpod-agent}
subjects:
- {kind: ServiceAccount, name: devpod-agent, namespace: devpod-system}
---
# Source: devpod/templates/agent-rbac.yaml
# What the console does in the DevPod namespace, through the agent.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devpod-agent
  namespace: devpods
  labels: 
    app.kubernetes.io/name: devpod
    app.kubernetes.io/instance: devpod
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: devpod-0.1.0
rules:
- apiGroups: ["devpod.io"]
  resources: ["devpods", "devpodsnapshots"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods", "events"]
  verbs: ["get", "list", "watch"]
# A DevPod's home volume, read only: one on a machine's own disk keeps its
# DevPod on that machine when the queue places it.
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get"]
# Events on DevPods (telemetry alerts), written in the DevPod's cluster.
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create"]
# The internal keys of the gateways the console names for this cluster,
# for its DevPods to trust (the controller reads them).
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["devpod-gateway-keys"]
  verbs: ["get", "update"]
# What the cluster's controller can do (it writes devpod-controller): the
# cluster takes queue jobs only where it runs them.
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["devpod-controller"]
  verbs: ["get"]
# Redeploy: delete a DevPod's Pod so the controller recreates it.
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["delete"]
# Job logs: the console reads a job rank's Pod log, to show and keep it.
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
# Job attach: the console attaches its submitter to a rank (srun's way).
- apiGroups: [""]
  resources: ["pods/attach"]
  verbs: ["get", "create"]
---
# Source: devpod/templates/agent-rbac.yaml
# The agent's own key: made on its first start, kept in one Secret, read
# back on later starts. And the controller's version, to report.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devpod-agent-identity
  namespace: devpod-system
  labels: 
    app.kubernetes.io/name: devpod
    app.kubernetes.io/instance: devpod
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: devpod-0.1.0
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["devpod-agent-identity"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames: ["devpod-controller"]
  verbs: ["get"]
---
# Source: devpod/templates/agent-rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devpod-agent
  namespace: devpods
  labels: 
    app.kubernetes.io/name: devpod
    app.kubernetes.io/instance: devpod
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: devpod-0.1.0
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: devpod-agent}
subjects:
- {kind: ServiceAccount, name: devpod-agent, namespace: devpod-system}
