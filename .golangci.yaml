run:
  timeout: 5m
  go: "1.25"

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - misspell
    - gocritic
    - gofmt
    - goimports

linters-settings:
  revive:
    rules:
      - name: exported           # doc comments; live.LiveHandler-style names are fine
        arguments: ["disableStutteringCheck"]
      - name: var-naming
      - name: context-as-argument
      - name: context-keys-type
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: if-return
      - name: increment-decrement
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: indent-error-flow
      - name: errorf
      - name: empty-block
      - name: superfluous-else
      - name: unreachable-code
  goimports:
    local-prefixes: github.com/mrhaoxx/devpod
  gocritic:
    disabled-checks:
      - exitAfterDefer   # os.Exit in main after a defer cancel(): nothing left to run
      - appendAssign     # x = append(y[:0], …) and buf := append(carry, …) are meant

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Deprecated, not broken: golang.org/x/net/http2 (the agent link's
    # telemetry streams; net/http has it now) and the S3 upload manager
    # (feature/s3/transfermanager). Moving off them is its own change.
    - linters: [staticcheck]
      text: "SA1019: .*(http2\\.|h2s\\.|t2\\.|manager\\.|s\\.uploader\\.)"
    - path: _test\.go
      linters:
        - errcheck
        - revive
