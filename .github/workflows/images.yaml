name: images

# Builds every image in images/ for amd64 and arm64 (each on its own
# runner, no emulation) — and the supervisor, which runs inside every
# DevPod, for riscv64 too (emulated: GitHub has no such runner; slow the
# first time, cached after) — and pushes them to ghcr.io/<owner>/devpod-<name>:
# main → dev and sha-<commit>, a v* tag → that tag. The chart's defaults
# pull ghcr.io/mrhaoxx/devpod-*:dev.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        image: [agent, controller, gateway, snapshot, supervisor, webui]
        arch: [amd64, arm64]
        include:
        - {image: supervisor, arch: riscv64}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 300
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-qemu-action@v3
      if: matrix.arch == 'riscv64'
      with:
        platforms: riscv64
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: images/${{ matrix.image }}/Dockerfile
        platforms: linux/${{ matrix.arch }}
        provenance: false
        outputs: type=image,name=${{ env.REGISTRY }}/devpod-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
        cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
    - name: Keep the digest
      run: |
        mkdir -p "$RUNNER_TEMP/digests"
        d='${{ steps.build.outputs.digest }}'
        touch "$RUNNER_TEMP/digests/${d#sha256:}"
    - uses: actions/upload-artifact@v4
      with:
        name: digest-${{ matrix.image }}-${{ matrix.arch }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1

  # One tag over an image's architectures; an image whose build failed on
  # any of them is not tagged (the others still are).
  tag:
    needs: build
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        image: [agent, controller, gateway, snapshot, webui]
        arches: [2]
        include:
        - {image: supervisor, arches: 3}
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: digest-${{ matrix.image }}-*
        path: ${{ runner.temp }}/digests
        merge-multiple: true
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/devpod-${{ matrix.image }}
        tags: |
          type=raw,value=dev,enable={{is_default_branch}}
          type=sha,prefix=sha-,enable={{is_default_branch}}
          type=ref,event=tag
    - name: Tag the architectures
      working-directory: ${{ runner.temp }}/digests
      env:
        IMAGE: ${{ env.REGISTRY }}/devpod-${{ matrix.image }}
      run: |
        n=$(ls | wc -l)
        [ "$n" -eq ${{ matrix.arches }} ] || { echo "::error::devpod-${{ matrix.image }}: $n of ${{ matrix.arches }} architectures built"; exit 1; }
        docker buildx imagetools create \
          $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON") \
          $(printf "$IMAGE@sha256:%s " *)
        docker buildx imagetools inspect "$(jq -r '.tags[0]' <<<"$DOCKER_METADATA_OUTPUT_JSON")"
