name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: "1.26.x"
        cache: true

    - name: Cache build deps
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

    - name: Generate
      run: |
        go generate ./...
        # Fail if go generate produced uncommitted changes
        # (= someone forgot to commit regenerated code).
        git diff --exit-code

    - name: Vet
      run: go vet ./...

    - name: Lint
      run: go run github.com/golangci/golangci-lint/cmd/golangci-lint@v1.62.0 run

    - name: Build
      run: go build ./...

    - name: Test
      run: |
        # envtest's API server and etcd for the controller tests
        export KUBEBUILDER_ASSETS="$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.20 use 1.31.0 --bin-dir "$PWD/bin" -p path)"
        go test ./... -count=1 -race -timeout 45m   # internal/webui alone takes ~13 min under -race on 8 cores

  web:
    runs-on: ubuntu-22.04
    defaults:
      run: {working-directory: web}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: web/package-lock.json
    - run: npm ci
    - name: Typecheck and unit tests
      run: npx tsc -b && npx vitest run

  helm-render:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: azure/setup-helm@v4
      with: {version: v3.16.0}
    - name: helm template
      run: helm template devpod deploy/chart > /tmp/out.yaml && wc -l /tmp/out.yaml
    - name: helm lint
      run: helm lint deploy/chart
    - name: chart assertions (audit wiring)
      run: bash deploy/test-chart.sh
