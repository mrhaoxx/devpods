# RKE2 example with an HTTP registry. Replace the documentation address
# 192.0.2.10:5000 and publish both images before deployment.
image:
  controller:
    repository: 192.0.2.10:5000/devpod-controller
    tag: rke2-snapshot
  containerdSnapshot:
    repository: 192.0.2.10:5000/devpod-snapshot
    tag: nerdctl-2.2.1
snapshot:
  containerd:
    address: /run/k3s/containerd/containerd.sock
    namespace: k8s.io
    insecureRegistry: true
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock: {cidr: 192.0.2.10/32}
      ports:
        - {protocol: TCP, port: 5000}
