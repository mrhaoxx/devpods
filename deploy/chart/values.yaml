image:
  controller:
    repository: ghcr.io/mrhaoxx/devpod-controller
    tag: dev
    pullPolicy: IfNotPresent
  gateway:
    repository: ghcr.io/mrhaoxx/devpod-gateway
    tag: dev
    pullPolicy: IfNotPresent
  supervisor:
    repository: ghcr.io/mrhaoxx/devpod-supervisor
    tag: dev
  snapshot:                     # snapshot Jobs: devpod-snapshot (images/snapshot); must be
    repository: ghcr.io/mrhaoxx/devpod-snapshot   # pullable from namespaces.devpods without a secret
    tag: dev
  webui:
    repository: ghcr.io/mrhaoxx/devpod-webui
    tag: dev
    pullPolicy: IfNotPresent

# Name of the cluster-scoped GatewayConfig this release creates and reads.
# Change it to run a second gateway/webui pair next to an existing one.
gatewayConfigName: default

namespaces:
  system: devpod-system
  devpods: devpods

# Pull secrets (must exist in namespaces.system) for the controller,
# gateway, webui and audit-migrate pods, e.g. [{name: harbor-pull}].
imagePullSecrets: []

controller:
  replicas: 1
  # Host directory under which per-user home dirs live (hostPath homes,
  # mounted at /home/<user>); empty = no hostPath homes.
  homeHostPath: ""
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits:   {cpu: 500m, memory: 512Mi}

gateway:
  replicas: 2
  # An audited session costs ~2 MiB of gateway memory (measured; ~0.5 MiB
  # without audit). 1Gi holds ~300 audited sessions on one replica, e.g.
  # while the other restarts. GOMEMLIMIT is set to 90% of the limit.
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits:   {cpu: 500m, memory: 1Gi}
  service:
    type: ClusterIP
    port: 22
  # HTTP proxy: ports of a DevPod published as
  # https://{id}-{port}{suffix}.{baseDomain}, where {id} is the DevPod's
  # random id. Private by default (the console signs the owner,
  # collaborators and admins in); the owner can make a port public.
  # User programs run on these hostnames, so prefer a domain of their own
  # (e.g. *.example-usercontent.com) over one shared with other services.
  http:
    enabled: false
    baseDomain: ""               # e.g. apps.example.com; needs wildcard DNS + TLS for *.baseDomain
    suffix: ""                   # fixed part after the port, e.g. "-devpod"
    # Gateway API route for *.baseDomain → the gateway's HTTP port.
    route:
      enabled: false
      gateway: {name: "", namespace: ""}
      httpsListener: ""
  # CLI over SSH (docs/cli.md): `ssh <user>@gateway list|create|…` runs
  # DevPod commands as the caller, who is known by SSH key. The gateway
  # calls the web UI's REST API with a key they share (kept Secret
  # devpod-cli-key), so webui.enabled is required. <user> stops being
  # usable as a DevPod user name.
  cli:
    enabled: false
    user: devpod
  # SSH front proxies allowed to log in on behalf of users, as
  # [{alias: openng, pubkey: "ssh-ed25519 AAAA… openng"}].
  trustedProxyKeys: []
  ldap:
    enabled: false
    url: ""
    bindDN: ""
    baseDN: ""
    userFilter: ""             # blank → controller default
    pubkeyAttribute: sshPublicKey
    requestTimeoutSeconds: 5
    cacheTTLSeconds: 300
    negativeCacheTTLSeconds: 30
    staleGraceSeconds: 900
    # Secrets MUST exist before the chart is installed. The chart
    # only references them; it does not generate them. Operators
    # create the Secrets out of band (or via a sealed-secret /
    # external-secrets pipeline).
    #
    # IMPORTANT: both Secrets must live in the same namespace as the
    # gateway Deployment (Values.namespaces.system). Cross-namespace
    # Secret mounts are not supported.
    caSecret:
      name: ""                 # secretRef.name; key "ca.crt"
      namespace: ""            # secretRef.namespace (informational; mount uses Pod's namespace)
    bindPasswordSecret:
      name: ""
      namespace: ""            # secretRef.namespace (informational)


webui:
  enabled: false
  replicas: 2
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits:   {cpu: 500m, memory: 512Mi}
  service:
    type: ClusterIP
    port: 80
  # Expose the UI through a Gateway API HTTPRoute (e.g. Envoy Gateway).
  # hostnames[0] is canonical and baseURL must be https://<hostnames[0]>;
  # plain HTTP (httpListener) and the other hostnames 301 to it.
  httpRoute:
    enabled: false
    gateway: {name: "", namespace: ""}
    hostnames: []
    httpsListener: ""            # Gateway listener (sectionName) for HTTPS
    httpListener: ""             # Gateway listener for plain HTTP; "" = no redirect route
  # External URL of the UI; the OAuth redirect URL becomes
  # baseURL + /auth/callback. An http:// baseURL disables the Secure
  # cookie attribute (dev/e2e only — use https in production).
  baseURL: ""
  userPrefix: ""                 # GitLab user xxxx → DevPod user <prefix>xxxx
  admins: []                     # usernames granted admin (also via User.spec.admin, kubectl)
  kore: auto                     # auto | on | off
  # Built-in username+password login (independent of OAuth). Admins
  # create users in the UI; who is an admin is set via kubectl
  # (User.spec.admin). At least one of passwordAuth / gitlab.issuerURL
  # must be enabled.
  passwordAuth: false
  passwordMinLength: 8
  # Sign users in with their password in the LDAP directory the gateway
  # takes SSH keys from (gateway.ldap, which must be enabled): the same
  # server, service account and user filter. Such users need no User
  # object; name the admins among them in webui.admins.
  ldapAuth: false
  # Let users edit User.spec.pubkeys via the UI. Disable when SSH keys
  # are managed externally (e.g. LDAP is the source of truth).
  pubkeySelfService: true
  # Gateway address rendered into `ssh [-p port] user+pod@host` command
  # lines, host or host:port. Empty → a <gateway> placeholder is shown.
  sshAdvertise: ""
  # Appended to the SSH login as <owner>+<pod>+<suffix> (e.g. a proxy /
  # routing token). Empty → the plain <owner>+<pod> form.
  sshLoginSuffix: ""
  # Web terminal: the webui connects to the SSH gateway as the logged-in
  # user with its own key, so the shell is recorded like any session.
  # Two steps: enable it, read the key's public half from the webui log
  # ("webshell_enabled pubkey=…"), then set publicKey — that lists the
  # key under the gateway's trustedProxyKeys (alias "webui"); gateways
  # read that list at start.
  webshell:
    enabled: false
    publicKey: ""                # "ssh-ed25519 AAAA…"
    gatewayHostKey: ""           # optional: pin the gateway's host key
  gitlab:
    issuerURL: ""
    clientID: ""
    # Secret with key "client-secret"; must pre-exist in namespaces.system.
    clientSecretSecret: {name: ""}
  # Secret with key "session-key" (>= 32 random bytes); must pre-exist
  # in namespaces.system. All replicas share it (stateless sessions).
  sessionKeySecret: {name: ""}
  defaultQuota:
    maxDevPods: 3
    compute: {cpu: "8", memory: "16Gi"}
    storage: "50Gi"
# Node reservations: a user holds a whole node for a time slot; only
# their DevPods run on it meanwhile, others' are hibernated at the start
# and the holder's at the end. Nodes are made reservable by label
# devpod.io/reservable=true (the console's node page). The controller and
# the webui read the same rules.
reservation:
  enabled: false
  granularity: 30m         # starts and ends align to this
  maxDuration: 24h         # longest single reservation; 0 = no limit
  maxAdvance: 336h         # how far ahead one may reserve; 0 = no limit
  clearNotice: 30m         # other DevPods on the node are warned this long before the start
  endingNotice: "30m,5m"   # the holder's DevPods are warned at these moments before the end
  retention: 720h          # ended / cancelled reservations are kept this long

# Live telemetry (phase 2 of the audit spec): every DevPod's supervisor
# samples cgroup / process / GPU / RDMA metrics and posts them to the
# webui leader. Requires audit.enabled (ClickHouse) and webui.enabled.
# New settings reach a DevPod when its Pod is next created.
telemetry:
  enabled: false
  metricsInterval: 1s           # container / GPU / RDMA sample period
  procScanInterval: 500ms       # /proc scan period (process start/exit, attribution)
  topN: 20                      # processes reported per metric besides the active ones
  gpu: true                     # nvidia-smi
  rdma: true                    # sysfs RDMA counters
  hooks: true                   # shell command hooks (bash / zsh / fish)
  retention:
    metrics1sDays: 7            # 1-second container / GPU / RDMA metrics
    metrics1mDays: 90           # 1-minute rollups
    process1sHours: 48          # 1-second process metrics
    snapshotDays: 7             # container snapshots
  idle:                         # "idle for 24 h" in the overview
    cpuPct: 5
    gpuPct: 5
  agentSilentAfter: 3m          # alert when a Running DevPod stops reporting
  # hostNetwork DevPods post from their node's IP, which no namespace
  # selector matches: list the node CIDRs here or their telemetry is
  # dropped by the ingest NetworkPolicy (when the CNI enforces it).
  ingestFromCIDRs: []
  # The webui leader decodes and writes every DevPod's telemetry; with
  # telemetry on these replace webui.resources (sizing: see
  # docs/superpowers/notes/2026-11-telemetry-phase2-measurements.md).
  webuiResources:
    requests: {cpu: 500m, memory: 512Mi}
    limits:   {cpu: "2", memory: 1Gi}

# Session audit (docs/superpowers/specs/2026-11-09-devpod-audit-telemetry-design.md).
# Off by default; when off the gateway behaves exactly as before.
audit:
  enabled: false
  notice: ""                    # login-banner notice; "" = default text
  retentionDays: 180            # ClickHouse TTL and S3 lifecycle (bundled / manageLifecycle)
  policy: {}                    # cluster default AuditPolicy → GatewayConfig.spec.audit.policy
  spool:
    sizeLimit: 20Gi             # gateway emptyDir and --audit-spool-max-bytes
  s3:
    endpoint: ""                # external mode, e.g. https://s3.example.com
    region: us-east-1
    bucket: devpod-audit
    pathStyle: true
    credentialsSecret: ""       # external mode: Secret with keys access-key, secret-key
    manageLifecycle: false      # external mode: let the migrate Job set expiration rules
    bundled:
      enabled: false            # single-replica Silo (MinIO fork) StatefulSet, no HA
      image: {repository: docker.io/pgsty/silo, tag: "RELEASE.2026-10-26T00-00-00Z"}
      storage: 100Gi
      storageClass: ""
  clickhouse:
    url: ""                     # external mode, e.g. clickhouse://clickhouse.example.com:9000
    database: devpod_audit
    # external mode: Secrets with keys username, password, one per component
    credentialsSecrets: {gateway: "", webui: "", migrate: ""}
    bundled:
      enabled: false            # single-replica ClickHouse StatefulSet, no HA
      image: {repository: clickhouse/clickhouse-server, tag: "26.8.36.3"}
      storage: 50Gi
      storageClass: ""

# Saving a running DevPod as an image (snapshot spec v2). The console and
# the CLI offer it when enabled. With imageTemplate set, images go to the
# platform registry by default (pushed with pushSecret); users may also
# name another address and bring its credentials. Without imageTemplate
# every snapshot names its address and credentials.
snapshot:
  enabled: false
  imageTemplate: ""              # e.g. harbor.example.com/devpod-users/{user}/{name}:{tag}
  pushSecret: ""                 # dockerconfigjson Secret in namespaces.devpods (a registry robot account)
  maxPerUser: 10                 # succeeded snapshots a user may keep; 0 = unlimited
  # The Job that commits a container runs on its node with the node's
  # runtime socket mounted; devpod-snapshot (image.snapshot) talks to the
  # runtime's API through it (containerd or Docker).
  containerdSocket: /run/containerd/containerd.sock   # on the nodes
  dockerImage: ""                # Job image for Docker nodes; "" = image.snapshot
