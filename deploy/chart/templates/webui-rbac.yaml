{{- if .Values.webui.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devpod-webui
  namespace: {{ .Values.namespaces.system }}
  labels: {{ include "devpod.labels" . | nindent 4 }}
---
# Namespaced rights in the devpods namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devpod-webui
  namespace: {{ .Values.namespaces.devpods }}
  labels: {{ include "devpod.labels" . | nindent 4 }}
rules:
- apiGroups: ["devpod.io"]
  resources: ["devpods", "devpodsnapshots", "devpodconfigs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods", "events"]
  verbs: ["get", "list", "watch"]
# Snapshot progress: follow the snapshot Job's output.
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
# Redeploy: delete a DevPod's Pod so the controller recreates it.
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["delete"]
{{- if include "devpod.telemetry.on" $ }}
# TelemetryAlert Events on DevPods.
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devpod-webui
  namespace: {{ .Values.namespaces.devpods }}
  labels: {{ include "devpod.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: devpod-webui}
subjects:
- {kind: ServiceAccount, name: devpod-webui, namespace: {{ .Values.namespaces.system }}}
---
# Users and DevPodTemplates are cluster-scoped: unavoidable ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devpod-webui
  labels: {{ include "devpod.labels" . | nindent 4 }}
rules:
- apiGroups: ["devpod.io"]
  resources: ["users", "devpodtemplates"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Read-only: the admin nodes page (capacity, readiness, GPU model).
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
{{- if dig "enabled" false (.Values.reservation | default dict) }}
# Node reservations: users reserve through the webui; the 可预约 switch
# patches the node's devpod.io/reservable label.
- apiGroups: ["devpod.io"]
  resources: ["reservations"]
  verbs: ["get", "list", "watch", "create", "update", "delete"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["patch"]
{{- end }}
{{- if dig "clusters" "enabled" false .Values.webui }}
# The clusters this console manages.
- apiGroups: ["devpod.io"]
  resources: ["clusters", "clusters/status"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- end }}
# Read-only: the audit policy endpoints show the cluster default.
- apiGroups: ["devpod.io"]
  resources: ["gatewayconfigs"]
  verbs: ["get", "list", "watch"]
{{- if ne .Values.webui.kore "off" }}
- apiGroups: ["kore.zjusct.io"]
  resources: ["korenodetopologies"]
  verbs: ["get", "list", "watch"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devpod-webui
  labels: {{ include "devpod.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: devpod-webui}
subjects:
- {kind: ServiceAccount, name: devpod-webui, namespace: {{ .Values.namespaces.system }}}
{{- if include "devpod.telemetry.on" $ }}
---
# Telemetry leader election, and the ingest EndpointSlice the leader
# points at itself.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devpod-webui-leader
  namespace: {{ .Values.namespaces.system }}
  labels: {{ include "devpod.labels" . | nindent 4 }}
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devpod-webui-leader
  namespace: {{ .Values.namespaces.system }}
  labels: {{ include "devpod.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: devpod-webui-leader}
subjects:
- {kind: ServiceAccount, name: devpod-webui, namespace: {{ .Values.namespaces.system }}}
{{- end }}
{{- end }}
{{- if and .Values.webui.enabled (dig "clusters" "enabled" false .Values.webui) }}
---
# The console's replicas find each other's names, to tell agents how many
# of them there are.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devpod-webui-instances
  namespace: {{ .Values.namespaces.system }}
  labels: {{ include "devpod.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devpod-webui-instances
  namespace: {{ .Values.namespaces.system }}
  labels: {{ include "devpod.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: devpod-webui-instances}
subjects:
- {kind: ServiceAccount, name: devpod-webui, namespace: {{ .Values.namespaces.system }}}
{{- end }}
{{- if and .Values.webui.enabled (include "devpod.audit.on" $) }}
---
# Live session viewing (audit spec §16): the webui finds the gateway Pod
# that holds a session through the gateway Service's EndpointSlices.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devpod-webui-live
  namespace: {{ .Values.namespaces.system }}
  labels: {{ include "devpod.labels" . | nindent 4 }}
rules:
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devpod-webui-live
  namespace: {{ .Values.namespaces.system }}
  labels: {{ include "devpod.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: devpod-webui-live}
subjects:
- {kind: ServiceAccount, name: devpod-webui, namespace: {{ .Values.namespaces.system }}}
{{- end }}
