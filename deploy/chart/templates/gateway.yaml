{{- $hub := dig "hub" dict .Values.gateway }}
{{- $hubOn := dig "enabled" false $hub }}
{{- if $hubOn }}
{{- if not $hub.name }}{{ fail "gateway.hub.enabled needs gateway.hub.name: the name the gateway was registered under at the console" }}{{ end }}
{{- if not $hub.console }}{{ fail "gateway.hub.enabled needs gateway.hub.console: the console's address" }}{{ end }}
{{- end }}
{{- $hubJoin := "" }}
{{- if $hubOn }}{{ $hubJoin = $hub.joinTokenSecret | default (ternary (printf "%s-join" (include "devpod.gateway.name" $)) "" (not (empty $hub.joinToken))) }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devpod.gateway.name" $ }}
  namespace: {{ .Values.namespaces.system }}
  labels: {{ include "devpod.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "devpod.gateway.name" $ }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "devpod.gateway.name" $ }}
    spec:
      serviceAccountName: {{ include "devpod.gateway.name" $ }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if include "devpod.audit.on" $ }}
      # Sessions get --shutdown-session-grace (60s), then the audit spool
      # drains for --audit-drain-timeout (220s) before exit.
      terminationGracePeriodSeconds: 300
      {{- end }}
      containers:
      - name: gateway
        image: "{{ .Values.image.gateway.repository }}:{{ .Values.image.gateway.tag }}"
        imagePullPolicy: {{ .Values.image.gateway.pullPolicy }}
        args:
        - --listen=:22
        - --host-key-dir=/etc/devpod/gateway
        - --gateway-config-name={{ $.Values.gatewayConfigName | default "default" }}
        {{- if include "devpod.audit.on" $ }}
        {{- include "devpod.audit.args" . | nindent 8 }}
        - --audit-spool-dir=/var/spool/devpod-audit
        - --audit-spool-max-bytes={{ include "devpod.audit.spoolMaxBytes" $ }}
        - --audit-live-listen=:8082
        - --audit-live-key-file=/etc/devpod/live/key
        {{- end }}
        {{- if include "devpod.http.on" $ }}
        - --http-listen=:8090
        - --http-base-domain={{ .Values.gateway.http.baseDomain }}
        - --http-subdomain-suffix={{ .Values.gateway.http.suffix }}
        - --http-auth-key-file=/etc/devpod/http/key
        - --http-login-url={{ required "webui.baseURL is required with gateway.http" .Values.webui.baseURL }}/http-auth
        {{- end }}
        {{- if $hubOn }}
        # one gateway for several clusters: DevPods and keys from the
        # console, the way to a DevPod through its cluster's agent
        - --console={{ $hub.console }}
        - --gateway-name={{ $hub.name }}
        - --gateway-namespace={{ .Values.namespaces.system }}
        - --agent-listen=:8443
        - --instance-selector=app.kubernetes.io/name={{ include "devpod.gateway.name" $ }}
        - --gateway-identity-secret={{ include "devpod.gateway.name" $ }}-identity
        {{- if $hubJoin }}
        - --join-token-file=/etc/devpod/gateway/join/token
        {{- end }}
        {{- end }}
        {{- if include "devpod.cli.on" $ }}
        - --cli-user={{ .Values.gateway.cli.user | default "devpod" }}
        - --cli-api-url=http://devpod-webui.{{ .Values.namespaces.system }}.svc:{{ .Values.webui.service.port }}
        - --cli-api-key-file=/etc/devpod/cli/key
        {{- end }}
        env:
        - name: POD_NAME
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        {{- with (dig "limits" "memory" "" .Values.gateway.resources) }}
        - {name: GOMEMLIMIT, value: {{ div (mul (include "devpod.mebibytes" (toString .)) 90) 100 }}MiB}
        {{- end }}
        ports:
        - {name: ssh,     containerPort: 22}
        - {name: metrics, containerPort: 8080}
        {{- if $hubOn }}
        - {name: agents, containerPort: 8443}
        {{- end }}
        {{- if include "devpod.audit.on" $ }}
        - {name: live, containerPort: 8082}
        {{- end }}
        {{- if include "devpod.http.on" $ }}
        - {name: http, containerPort: 8090}
        {{- end }}
        # SSH listens on port 22 (privileged). Grant only NET_BIND_SERVICE
        # so the container can bind <1024 without running as root.
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
            add: ["NET_BIND_SERVICE"]
        volumeMounts:
        - name: host-key
          mountPath: /etc/devpod/gateway
          readOnly: true
        - name: internal-key
          mountPath: /etc/devpod/gateway/internal
          readOnly: true
        {{- if $hubJoin }}
        - {name: hub-join, mountPath: /etc/devpod/gateway/join, readOnly: true}
        {{- end }}
        {{- if include "devpod.audit.on" $ }}
        - {name: audit-spool, mountPath: /var/spool/devpod-audit}
        - {name: live-key, mountPath: /etc/devpod/live, readOnly: true}
        {{- include "devpod.audit.mounts" . | nindent 8 }}
        {{- end }}
        {{- if include "devpod.http.on" $ }}
        - {name: http-key, mountPath: /etc/devpod/http, readOnly: true}
        {{- end }}
        {{- if include "devpod.cli.on" $ }}
        - {name: cli-key, mountPath: /etc/devpod/cli, readOnly: true}
        {{- end }}
        {{- if .Values.gateway.ldap.enabled }}
        - name: ldap-secrets
          mountPath: /etc/devpod/gateway/ldap
          readOnly: true
        {{- end }}
        resources: {{- toYaml .Values.gateway.resources | nindent 10 }}
        readinessProbe:
          tcpSocket: {port: ssh}
          initialDelaySeconds: 2
        livenessProbe:
          tcpSocket: {port: ssh}
          periodSeconds: 30
      volumes:
      - name: host-key
        secret:
          secretName: {{ include "devpod.gateway.name" $ }}-host-key
      - name: internal-key
        secret:
          secretName: {{ include "devpod.gateway.name" $ }}-internal-key
      {{- if $hubJoin }}
      - name: hub-join
        secret:
          secretName: {{ $hubJoin }}
      {{- end }}
      {{- if include "devpod.audit.on" $ }}
      - name: audit-spool
        emptyDir: {sizeLimit: {{ .Values.audit.spool.sizeLimit }}}
      {{- include "devpod.audit.volumes" (dict "root" $ "component" "gateway") | nindent 6 }}
      - name: live-key
        secret:
          secretName: devpod-live-key
      {{- end }}
      {{- if include "devpod.http.on" $ }}
      - name: http-key
        secret:
          secretName: devpod-http-key
      {{- end }}
      {{- if include "devpod.cli.on" $ }}
      - name: cli-key
        secret:
          secretName: devpod-cli-key
      {{- end }}
      {{- if .Values.gateway.ldap.enabled }}
      - name: ldap-secrets
        projected:
          sources:
          - secret:
              name: {{ required "gateway.ldap.caSecret.name is required when ldap is enabled" .Values.gateway.ldap.caSecret.name | quote }}
              items:
              - key: ca.crt
                path: ca.crt
          - secret:
              name: {{ required "gateway.ldap.bindPasswordSecret.name is required when ldap is enabled" .Values.gateway.ldap.bindPasswordSecret.name | quote }}
              items:
              - key: password
                path: password
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "devpod.gateway.name" $ }}
  namespace: {{ .Values.namespaces.system }}
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "devpod.gateway.name" $ }}
  ports:
  - port: {{ .Values.gateway.service.port }}
    targetPort: ssh
{{- if $hubOn }}
---
# Where the clusters' agents reach this gateway (/agent/connect).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "devpod.gateway.name" $ }}-agents
  namespace: {{ .Values.namespaces.system }}
  labels: {{ include "devpod.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "devpod.gateway.name" $ }}
  ports:
  - {name: agents, port: 80, targetPort: agents}
{{- $ar := dig "route" dict .Values.gateway.hub }}
{{- if dig "enabled" false $ar }}
---
# The agents' endpoint for clusters outside this one: their agents dial
# it (one address in front of every replica; each handshake says which
# replica was reached, and an agent dials until it has them all).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "devpod.gateway.name" $ }}-agents
  namespace: {{ .Values.namespaces.system }}
  labels: {{ include "devpod.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: {{ required "gateway.hub.route.gateway.name is required" $ar.gateway.name }}
    namespace: {{ $ar.gateway.namespace | default .Values.namespaces.system }}
    {{- with $ar.httpsListener }}
    sectionName: {{ . }}
    {{- end }}
  hostnames:
  - {{ required "gateway.hub.route.hostname is required" $ar.hostname }}
  rules:
  - backendRefs:
    - name: {{ include "devpod.gateway.name" $ }}-agents
      port: 80
{{- end }}
---
# The gateway's own key (one Secret, made on its first start), and the
# names of its replicas, which agents are told to connect to.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "devpod.gateway.name" $ }}-hub
  namespace: {{ .Values.namespaces.system }}
  labels: {{ include "devpod.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["{{ include "devpod.gateway.name" $ }}-identity"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "devpod.gateway.name" $ }}-hub
  namespace: {{ .Values.namespaces.system }}
  labels: {{ include "devpod.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ include "devpod.gateway.name" $ }}-hub}
subjects:
- {kind: ServiceAccount, name: {{ include "devpod.gateway.name" $ }}, namespace: {{ .Values.namespaces.system }}}
{{- if $hub.joinToken }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "devpod.gateway.name" $ }}-join
  namespace: {{ .Values.namespaces.system }}
  labels: {{ include "devpod.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ $hub.joinToken | b64enc | quote }}
{{- end }}
{{- end }}
