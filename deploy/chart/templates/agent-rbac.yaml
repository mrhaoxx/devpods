{{- if dig "enabled" false (.Values.agent | default dict) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devpod-agent
  namespace: {{ .Values.namespaces.system }}
  labels: {{ include "devpod.labels" . | nindent 4 }}
---
# What the console does in the DevPod namespace, through the agent.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devpod-agent
  namespace: {{ .Values.namespaces.devpods }}
  labels: {{ include "devpod.labels" . | nindent 4 }}
rules:
- apiGroups: ["devpod.io"]
  resources: ["devpods", "devpodsnapshots"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods", "events"]
  verbs: ["get", "list", "watch"]
# Redeploy: delete a DevPod's Pod so the controller recreates it.
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devpod-agent
  namespace: {{ .Values.namespaces.devpods }}
  labels: {{ include "devpod.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: devpod-agent}
subjects:
- {kind: ServiceAccount, name: devpod-agent, namespace: {{ .Values.namespaces.system }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devpod-agent
  labels: {{ include "devpod.labels" . | nindent 4 }}
rules:
# Users here hold only what the console writes of them: the registries
# they saved credentials for, for this cluster's controller.
- apiGroups: ["devpod.io"]
  resources: ["users"]
  verbs: ["get", "list", "watch", "create", "update"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
# Read always (the console keeps them in its cache of this cluster);
# changed only where reservations are on.
- apiGroups: ["devpod.io"]
  resources: ["reservations"]
  verbs: ["get", "list", "watch"]
{{- if dig "enabled" false (.Values.reservation | default dict) }}
- apiGroups: ["devpod.io"]
  resources: ["reservations"]
  verbs: ["create", "update", "delete"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["patch"]
{{- end }}
{{- if ne .Values.webui.kore "off" }}
- apiGroups: ["kore.zjusct.io"]
  resources: ["korenodetopologies"]
  verbs: ["get", "list", "watch"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devpod-agent
  labels: {{ include "devpod.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: devpod-agent}
subjects:
- {kind: ServiceAccount, name: devpod-agent, namespace: {{ .Values.namespaces.system }}}
---
# The agent's own key: made on its first start, kept in one Secret, read
# back on later starts. And the controller's version, to report.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devpod-agent-identity
  namespace: {{ .Values.namespaces.system }}
  labels: {{ include "devpod.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["devpod-agent-identity"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames: ["devpod-controller"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devpod-agent-identity
  namespace: {{ .Values.namespaces.system }}
  labels: {{ include "devpod.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: devpod-agent-identity}
subjects:
- {kind: ServiceAccount, name: devpod-agent, namespace: {{ .Values.namespaces.system }}}
{{- end }}
