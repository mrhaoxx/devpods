{{- if .Values.webui.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: devpod-webui-quota
  namespace: {{ .Values.namespaces.system }}
  labels: {{ include "devpod.labels" . | nindent 4 }}
data:
  default-quota.yaml: |
{{ toYaml .Values.webui.defaultQuota | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devpod-webui
  namespace: {{ .Values.namespaces.system }}
  labels: {{ include "devpod.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.webui.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: devpod-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devpod-webui
      annotations:
        checksum/quota: {{ toYaml .Values.webui.defaultQuota | sha256sum }}
    spec:
      serviceAccountName: devpod-webui
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: webui
        image: "{{ .Values.image.webui.repository }}:{{ .Values.image.webui.tag }}"
        imagePullPolicy: {{ .Values.image.webui.pullPolicy }}
        args:
        - --listen=:8080
        - --session-key-file=/etc/devpod/webui/session/session-key
        - --default-quota-file=/etc/devpod/webui/default-quota.yaml
        - --devpod-namespace={{ .Values.namespaces.devpods }}
        - --gateway-config-name={{ $.Values.gatewayConfigName | default "default" }}
        - --kore={{ .Values.webui.kore }}
        - --admins={{ join "," .Values.webui.admins }}
        {{- if .Values.webui.baseURL }}
        - --external-url={{ .Values.webui.baseURL }}
        {{- end }}
        {{- if dig "clusters" "enabled" false .Values.webui }}
        - --clusters=true
        # agents keep connections to every replica
        - --instance-selector=app.kubernetes.io/name=devpod-webui
        - --instance-namespace={{ .Values.namespaces.system }}
        {{- end }}
        {{- if .Values.webui.passwordAuth }}
        - --password-auth=true
        - --password-min-length={{ .Values.webui.passwordMinLength }}
        {{- end }}
        {{- if .Values.webui.ldapAuth }}
        {{- if not .Values.gateway.ldap.enabled }}{{ fail "webui.ldapAuth needs gateway.ldap.enabled: the console signs users in against the gateway's LDAP directory" }}{{ end }}
        - --ldap-auth=true
        {{- end }}
        {{- if .Values.webui.gitlab.issuerURL }}
        - --gitlab-issuer-url={{ .Values.webui.gitlab.issuerURL }}
        - --oauth-client-id={{ required "webui.gitlab.clientID is required when gitlab.issuerURL is set" .Values.webui.gitlab.clientID }}
        - --oauth-client-secret-file=/etc/devpod/webui/oauth/client-secret
        - --redirect-url={{ required "webui.baseURL is required for OAuth" .Values.webui.baseURL }}/auth/callback
        - --user-prefix={{ .Values.webui.userPrefix }}
        {{- end }}
        {{- if hasKey .Values.webui "pubkeySelfService" }}
        - --pubkey-self-service={{ .Values.webui.pubkeySelfService }}
        {{- end }}
        {{- if .Values.webui.sshAdvertise }}
        - --ssh-advertise={{ .Values.webui.sshAdvertise }}
        {{- end }}
        {{- if .Values.webui.sshLoginSuffix }}
        - --ssh-login-suffix={{ .Values.webui.sshLoginSuffix }}
        {{- end }}
        {{- if (.Values.webui.webshell | default dict).enabled }}
        - --webshell-key-file=/etc/devpod/webshell/id_ed25519
        - --webshell-gateway={{ include "devpod.gateway.name" $ }}.{{ .Values.namespaces.system }}.svc:22
        {{- with (.Values.webui.webshell | default dict).gatewayHostKey }}
        - --webshell-gateway-host-key={{ . }}
        {{- end }}
        {{- end }}
        {{- if include "devpod.audit.on" $ }}
        {{- include "devpod.audit.args" . | nindent 8 }}
        - --audit-live-key-file=/etc/devpod/live/key
        - --audit-live-gateway-namespace={{ .Values.namespaces.system }}
        {{- end }}
        {{- if include "devpod.http.on" $ }}
        - --http-proxy-host={id}-{port}{{ .Values.gateway.http.suffix }}.{{ .Values.gateway.http.baseDomain }}
        - --http-proxy-key-file=/etc/devpod/http/key
        {{- with .Values.gateway.http.externalPort }}
        - --http-proxy-port={{ . }}
        {{- end }}
        {{- end }}
        {{- if include "devpod.cli.on" $ }}
        - --cli-api-key-file=/etc/devpod/cli/key
        {{- end }}
        {{- with (.Values.snapshot | default dict) }}
        {{- if or .enabled .imageTemplate }}
        - --snapshots=true
        {{- with .imageTemplate }}
        - --snapshot-image-template={{ . }}
        {{- end }}
        {{- with .pushSecret }}
        - --snapshot-push-secret={{ . }}
        {{- end }}
        - --snapshot-max-per-user={{ .maxPerUser | default 10 }}
        {{- end }}
        {{- end }}
        {{- if dig "enabled" false (.Values.reservation | default dict) }}
        - --reservations=true
        - --reservation-granularity={{ .Values.reservation.granularity }}
        - --reservation-max-duration={{ .Values.reservation.maxDuration }}
        - --reservation-max-advance={{ .Values.reservation.maxAdvance }}
        - --reservation-clear-notice={{ .Values.reservation.clearNotice }}
        {{- end }}
        {{- if include "devpod.telemetry.on" $ }}
        - --ingest-listen=:8081
        - --ingest-key-file=/etc/devpod/ingest/key
        - --leader-election-namespace={{ .Values.namespaces.system }}
        - --ingest-service=devpod-webui-ingest
        - --idle-cpu-pct={{ .Values.telemetry.idle.cpuPct }}
        - --idle-gpu-pct={{ .Values.telemetry.idle.gpuPct }}
        - --agent-silent-after={{ .Values.telemetry.agentSilentAfter }}
        env:
        # the leader allocates per batch; trade memory for GC time
        - {name: GOGC, value: "200"}
        - {name: GOMEMLIMIT, value: {{ div (mul (include "devpod.mebibytes" (toString .Values.telemetry.webuiResources.limits.memory)) 90) 100 }}MiB}
        # identity in the leader Lease and the address the leader publishes
        - name: POD_NAME
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        - name: POD_IP
          valueFrom: {fieldRef: {fieldPath: status.podIP}}
        {{- end }}
        ports:
        - {name: http, containerPort: 8080}
        {{- if include "devpod.telemetry.on" $ }}
        - {name: ingest, containerPort: 8081}
        {{- end }}
        readinessProbe:
          httpGet: {path: /healthz, port: http}
        {{- if include "devpod.telemetry.on" $ }}
        resources: {{- toYaml .Values.telemetry.webuiResources | nindent 10 }}
        {{- else }}
        resources: {{- toYaml .Values.webui.resources | nindent 10 }}
        {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          readOnlyRootFilesystem: true
        volumeMounts:
        {{- if .Values.webui.gitlab.issuerURL }}
        - {name: oauth, mountPath: /etc/devpod/webui/oauth, readOnly: true}
        {{- end }}
        - {name: session, mountPath: /etc/devpod/webui/session, readOnly: true}
        {{- if .Values.webui.ldapAuth }}
        - {name: ldap-secrets, mountPath: /etc/devpod/webui/ldap, readOnly: true}
        {{- end }}
        - {name: quota, mountPath: /etc/devpod/webui/default-quota.yaml, subPath: default-quota.yaml, readOnly: true}
        {{- if (.Values.webui.webshell | default dict).enabled }}
        - {name: webshell-key, mountPath: /etc/devpod/webshell, readOnly: true}
        {{- end }}
        {{- if include "devpod.audit.on" $ }}
        {{- include "devpod.audit.mounts" . | nindent 8 }}
        - {name: live-key, mountPath: /etc/devpod/live, readOnly: true}
        {{- end }}
        {{- if include "devpod.http.on" $ }}
        - {name: http-key, mountPath: /etc/devpod/http, readOnly: true}
        {{- end }}
        {{- if include "devpod.cli.on" $ }}
        - {name: cli-key, mountPath: /etc/devpod/cli, readOnly: true}
        {{- end }}
        {{- if include "devpod.telemetry.on" $ }}
        {{- include "devpod.telemetry.keyMount" . | nindent 8 }}
        {{- end }}
      volumes:
      {{- if .Values.webui.ldapAuth }}
      - name: ldap-secrets
        projected:
          sources:
          - secret:
              name: {{ required "gateway.ldap.caSecret.name is required when ldap is enabled" .Values.gateway.ldap.caSecret.name | quote }}
              items:
              - key: ca.crt
                path: ca.crt
          - secret:
              name: {{ required "gateway.ldap.bindPasswordSecret.name is required when ldap is enabled" .Values.gateway.ldap.bindPasswordSecret.name | quote }}
              items:
              - key: password
                path: password
      {{- end }}
      {{- if .Values.webui.gitlab.issuerURL }}
      - name: oauth
        secret:
          secretName: {{ required "webui.gitlab.clientSecretSecret.name is required for OAuth" .Values.webui.gitlab.clientSecretSecret.name }}
      {{- end }}
      - name: session
        secret:
          secretName: {{ required "webui.sessionKeySecret.name is required" .Values.webui.sessionKeySecret.name }}
      - name: quota
        configMap:
          name: devpod-webui-quota
      {{- if (.Values.webui.webshell | default dict).enabled }}
      - name: webshell-key
        secret:
          secretName: devpod-webshell-key
      {{- end }}
      {{- if include "devpod.audit.on" $ }}
      {{- include "devpod.audit.volumes" (dict "root" $ "component" "webui") | nindent 6 }}
      - name: live-key
        secret:
          secretName: devpod-live-key
      {{- end }}
      {{- if include "devpod.http.on" $ }}
      - name: http-key
        secret:
          secretName: devpod-http-key
      {{- end }}
      {{- if include "devpod.cli.on" $ }}
      - name: cli-key
        secret:
          secretName: devpod-cli-key
      {{- end }}
      {{- if include "devpod.telemetry.on" $ }}
      {{- include "devpod.telemetry.keyVolume" . | nindent 6 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: devpod-webui
  namespace: {{ .Values.namespaces.system }}
  labels: {{ include "devpod.labels" . | nindent 4 }}
spec:
  type: {{ .Values.webui.service.type }}
  selector:
    app.kubernetes.io/name: devpod-webui
  ports:
  - {name: http, port: {{ .Values.webui.service.port }}, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: devpod-webui
  namespace: {{ .Values.namespaces.system }}
  labels: {{ include "devpod.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: devpod-webui
  policyTypes: [Ingress]
  ingress:
  - ports: [{port: 8080}]
{{- end }}
