{{- if .Values.audit.enabled }}
# Creates the bucket / lifecycle (bundled or manageLifecycle) and applies
# ClickHouse migrations + retention TTLs on every install and upgrade.
apiVersion: batch/v1
kind: Job
metadata:
  name: devpod-audit-migrate
  namespace: {{ .Values.namespaces.system }}
  labels: {{ include "devpod.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devpod-audit-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: migrate
        image: "{{ .Values.image.webui.repository }}:{{ .Values.image.webui.tag }}"
        imagePullPolicy: {{ .Values.image.webui.pullPolicy }}
        args:
        - migrate
        {{- include "devpod.audit.args" . | nindent 8 }}
        - --retention-days={{ .Values.audit.retentionDays }}
        - --manage-lifecycle={{ or .Values.audit.s3.bundled.enabled .Values.audit.s3.manageLifecycle }}
        - --create-bucket={{ .Values.audit.s3.bundled.enabled }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          readOnlyRootFilesystem: true
        volumeMounts: {{- include "devpod.audit.mounts" . | nindent 8 }}
      volumes: {{- include "devpod.audit.volumes" (dict "root" $ "component" "migrate") | nindent 6 }}
{{- end }}
