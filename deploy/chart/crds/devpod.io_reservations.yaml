---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: reservations.devpod.io
spec:
  group: devpod.io
  names:
    kind: Reservation
    listKind: ReservationList
    plural: reservations
    shortNames:
    - rsv
    singular: reservation
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.node
      name: Node
      type: string
    - jsonPath: .spec.user
      name: User
      type: string
    - jsonPath: .spec.start
      name: Start
      type: string
    - jsonPath: .spec.end
      name: End
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Reservation is a node reservation.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ReservationSpec: one user holds one whole node for [Start, End).
              During that time only that user's DevPods may run on the node.
            properties:
              cancelled:
                description: |-
                  Cancelled is written by the webui on cancel or early release; the
                  controller then treats the reservation as over.
                properties:
                  at:
                    format: date-time
                    type: string
                  by:
                    type: string
                required:
                - at
                - by
                type: object
              end:
                format: date-time
                type: string
              extends:
                description: |-
                  Extends names the reservation this one prolongs: an extension is a
                  new segment whose Start equals that one's End.
                type: string
              node:
                minLength: 1
                type: string
              start:
                format: date-time
                type: string
              user:
                minLength: 1
                type: string
            required:
            - end
            - node
            - start
            - user
            type: object
          status:
            description: ReservationStatus is written by the controller.
            properties:
              clearedDevPods:
                description: 'ClearedDevPods: other users'' DevPods hibernated at
                  the start.'
                items:
                  type: string
                type: array
              hibernatedAtEnd:
                description: 'HibernatedAtEnd: the holder''s DevPods hibernated at
                  the end.'
                items:
                  type: string
                type: array
              notifiedClearAt:
                description: |-
                  NotifiedClearAt: the clearing notice went out to the DevPods then
                  on the node.
                format: date-time
                type: string
              phase:
                description: ReservationPhase is where a reservation is on its timeline.
                enum:
                - Upcoming
                - Active
                - Ended
                - Cancelled
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
