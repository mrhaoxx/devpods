---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: nodereservations.devpod.io
spec:
  group: devpod.io
  names:
    kind: NodeReservation
    listKind: NodeReservationList
    plural: nodereservations
    shortNames:
    - nrsv
    singular: nodereservation
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.cluster
      name: Cluster
      type: string
    - jsonPath: .spec.node
      name: Node
      type: string
    - jsonPath: .spec.user
      name: User
      type: string
    - jsonPath: .spec.start
      name: Start
      type: string
    - jsonPath: .spec.end
      name: End
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NodeReservation is one user's share of one machine for a period, kept
          by the console in its own cluster: when it starts the console clears
          whoever is in its way (after a notice); when it ends the console
          hibernates the holder's DevPods there that only it let run.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              NodeReservationSpec is one user's share of one machine (of one of the
              console's clusters) for a while — some of its cards and cores, or all of
              it — guaranteed: a machine's reservations never add up to more than it
              has. Where the access rules say so, it is also the permit to use it.
            properties:
              cancelled:
                description: 'Cancelled: ended early (or never started) — by whom,
                  when.'
                properties:
                  at:
                    format: date-time
                    type: string
                  by:
                    type: string
                required:
                - at
                - by
                type: object
              cluster:
                description: 'Cluster: the node''s cluster ("" in a console of one
                  cluster).'
                type: string
              cpu:
                anyOf:
                - type: integer
                - type: string
                description: |-
                  CPU: the cores reserved; absent, all the machine has. Both absent:
                  the whole machine, which overlaps no other reservation.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              end:
                format: date-time
                type: string
              gpu:
                description: 'GPU: the cards reserved; absent, all the machine has.'
                format: int32
                minimum: 0
                type: integer
              node:
                minLength: 1
                type: string
              purpose:
                description: 'Purpose: what it is for, as its holder says — one line.'
                maxLength: 200
                type: string
              start:
                format: date-time
                type: string
              user:
                minLength: 1
                type: string
            required:
            - end
            - node
            - start
            - user
            type: object
          status:
            description: NodeReservationStatus is the console's record of a reservation's
              end.
            properties:
              cleared:
                description: 'Cleared: other users'' DevPods hibernated to give it
                  its share.'
                items:
                  type: string
                type: array
              ended:
                description: 'Ended: its end was carried out.'
                type: boolean
              hibernatedAtEnd:
                description: 'HibernatedAtEnd: the holder''s DevPods hibernated then.'
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
