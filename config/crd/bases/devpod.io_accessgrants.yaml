---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: accessgrants.devpod.io
spec:
  group: devpod.io
  names:
    kind: AccessGrant
    listKind: AccessGrantList
    plural: accessgrants
    singular: accessgrant
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AccessGrant gives management permissions on machines to users — one
          grant per object, in the console's cluster; grants add up, none takes
          away. Admins have every permission anyway.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AccessGrantSpec: a condition — the access rules' language, on the user
              granted and the cluster and machine acted on — and what it grants.
            properties:
              description:
                description: 'Description: for people.'
                type: string
              match:
                description: |-
                  Match: the condition (cluster, machine, user, group; and, or, not);
                  never empty — to grant everyone, write everyone.
                maxLength: 2000
                minLength: 1
                type: string
              permissions:
                description: Permissions granted where the condition holds.
                items:
                  description: |-
                    GrantPermission is a management permission a grant gives (design
                    2026-11-20 §6).
                  enum:
                  - setReservable
                  - viewAudit
                  - disconnectSessions
                  - manageReservations
                  type: string
                minItems: 1
                type: array
            required:
            - match
            - permissions
            type: object
        type: object
    served: true
    storage: true
